[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A procedural maze generator supporting DFS and Eller's algorithms"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]

[project.optional-dependencies]
dev = ["flake8", "mypy", "build"]